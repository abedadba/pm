<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Management MVP</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(3, 33, 71, 0.12);
        max-width: 540px;
        width: 90%;
        padding: 32px;
      }
      h1 {
        color: #032147;
        margin-top: 0;
      }
      .status {
        font-weight: bold;
        color: #209dd7;
      }
      button {
        border: none;
        border-radius: 8px;
        background: #753991;
        color: white;
        padding: 10px 18px;
        font-size: 14px;
        cursor: pointer;
      }
      #result {
        margin-top: 16px;
        color: #032147;
        min-height: 24px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Hello World</h1>
      <p class="status">Backend is live.</p>
      <button id="callApi">Call API</button>
      <div id="result">Waiting for API response...</div>
    </main>

    <script>
      document.getElementById('callApi').addEventListener('click', async () => {
        const response = await fetch('/api/hello');
        const data = await response.json();
        document.getElementById('result').textContent = JSON.stringify(data);
      });
    </script>
  </body>
</html>
